<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <h1>Seccion De Formularios</h1>
    <form>
      <input
        type="text"
        required
        placeholder="Tu Nombre"
        minlength="3"
        maxlength="20"
      />
      <hr width="475" />
      <input type="email" required placeholder="Tu Mail" />
      <hr width="475" />
      <input type="password" required placeholder="Tu Contraseña" />
      <hr width="475" />
      <p>Como Te Identificas?</p>
      <input type="radio" /><label>Hombre</label> <input type="radio" /><label
        >Mujer</label
      >
      <input type="radio" /><label>Otro</label>
      <hr width="475" />
      <p>Cuantos Años Tienes?</p>
      <input type="checkbox" /><label>13-18</label>
      <input type="checkbox" /><label>18-25</label>
      <input type="checkbox" /><label>+25</label>
      <hr width="475" />
      <p>Selecciona motivo de solicitud</p>
      <select required>
        <option value="problema">Problema Tecnico</option>
        <option value="soporte">Contacto Con El Soporte</option>
        <option value="reseñas">Reseñas</option>
      </select>
      <hr width="475" />
      <textarea
        required
        cols="50"
        rows="5"
        placeholder="Ingresar solicitud"
      ></textarea>
      <p>Adjuntar imagen para solicutud(opcional)</p>
      <input type="file" />
    </form>
  </body>
</html>
